<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="AccurateClock provides high-precision time synchronization with millisecond accuracy, global timezone support, and a sleek analog-digital interface, all while loading faster than a AC-130.">
  <link rel="canonical" href="https://accurateclock.pages.dev/">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cstyle%3Ecircle %7B fill: none; stroke: currentColor; stroke-width: 2; %7D path %7B fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; %7D %40media (prefers-color-scheme: dark) %7B svg %7B color: %23F4F4F4; %7D %7D %40media (prefers-color-scheme: light) %7B svg %7B color: %23121212; %7D %7D%3C/style%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cpath d='M12 6v6l4 2'/%3E%3C/svg%3E">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>AccurateClock – High Precision Online Atomic Clock</title>
 
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "AccurateClock",
    "url": "https://accurateclock.pages.dev/",
    "applicationCategory": "UtilityApplication",
    "operatingSystem": "All"
  }
  </script>

  <style>
    :root {
      --bg: #F4F4F4;
      --text: #121212;
      --muted: #666;
      --border: rgba(0,0,0,0.08);
    }
    body.dark {
      --bg: #121212;
      --text: #F4F4F4;
      --muted: #999;
      --border: rgba(255,255,255,0.08);
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      transition: background 0.3s ease;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      z-index: 10;
    }
    .wrapper {
      display: flex;
      align-items: center;
      gap: 40px;
      padding: 20px;
      flex: 1;
    }
    .clock-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .date-row {
      font-size: clamp(24px, 4vw, 40px);
      font-weight: 300;
      color: var(--muted);
    }
    .time-row {
      font-size: clamp(32px, 6vw, 80px);
      font-weight: 200;
      font-family: monospace;
      font-variant-numeric: tabular-nums;
    }
    .subnano {
      font-size: 0.4em;
      opacity: 0.6;
    }
    #timeRow > span:not(.subnano) { font-size: 1em; }
    canvas {
      width: 220px;
      height: 220px;
    }
    #tzMenu {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70%;
      background: var(--bg);
      border-top: 1px solid var(--border);
      transform: translateY(100%);
      transition: transform 0.3s ease;
      z-index: 100;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    #tzMenu.open {
      transform: translateY(0);
    }
    #tzSearch {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      font-size: 16px;
    }
    #tzList {
      flex: 1;
      overflow-y: auto;
    }
    .tz-link {
      position: fixed;
      bottom: 10px;
      right: 10px;
      text-decoration: none;
      color: var(--muted);
      font-size: 20px;
      cursor: pointer;
      opacity: 0.5;
    }
    .tz-option {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .tz-option:hover {
      background: var(--border);
    }
    /* Accessible and clean visually hidden style for H1 SEO robot tracking */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
    @media (max-width: 768px) {
      .wrapper {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
<body>
<button class="theme-toggle" id="themeToggle">☾</button>
<button class="theme-toggle" id="formatToggle" style="right:85px;">24H</button>
<main class="wrapper">
  <h1 class="visually-hidden">AccurateClock - High Precision Online Atomic Clock</h1>
  
  <div class="clock-block">
    <div id="dateRow" class="date-row">---- -- --</div>
    <div id="timeRow" class="time-row">
      --:--:--.---
      <span class="subnano">000000</span>
    </div>
  <div id="tzDisplay" style="font-size: 12px; color: var(--muted);">Local Time</div>
  <div id="rttDisplay" style="font-size: 12px; color: var(--muted);">RTT: -- ms</div>
  <div id="driftDisplay" style="font-size: 12px; color: var(--muted);">Drift: -- ms</div>
  </div>
  <canvas id="analogClock" width="440" height="440" style="width:220px; height:220px;"></canvas>
</main>
<div id="tzMenu">
  <input type="text" id="tzSearch" placeholder="Search GMT offset (e.g. GMT+5)...">
  <div id="tzList"></div>
  <button onclick="toggleMenu()" style="width:100%; padding:15px; margin-top:10px; cursor:pointer;">Close</button>
</div>
<a class="tz-link" href="#tzMenu" id="tzToggleLink">🕒</a>
<script>
const canvas = document.getElementById("analogClock");
const ctx = canvas.getContext("2d");
let bc = null;
try {
  if ("BroadcastChannel" in window) bc = new BroadcastChannel("clock_sync");
} catch {}

const tzToggleLink = document.getElementById("tzToggleLink");
let selectedTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
let wakeLock = null;
let lastTitleMinute = "";

let anchorServerTimeUs = Date.now() * 1000;
let anchorPerfTime = performance.now();
let currentRTTUs = 0;
let currentDriftUs = 0;
let use24Hour = localStorage.getItem("timeFormat") !== "12";
let syncInProgress = false;

const rttDisplay = document.getElementById("rttDisplay");
const driftDisplay = document.getElementById("driftDisplay");

function readEpochUs(data) {
  if (Number.isSafeInteger(data.epoch_us)) return data.epoch_us;
  if (typeof data.epoch_us === "number" && Number.isFinite(data.epoch_us)) {
    return Math.round(data.epoch_us);
  }
  if (typeof data.epoch_ms === "number" && Number.isFinite(data.epoch_ms)) {
    return Math.round(data.epoch_ms * 1000);
  }
  throw new Error("Clock response did not contain a valid epoch timestamp");
}

async function syncTime() {
  if (syncInProgress) return;
  syncInProgress = true;

  try {
    const perfSend = performance.now();
    const clientSendUs = Date.now() * 1000;
    const response = await fetch("https://accurateclock.live-by-unix.workers.dev/", {
      cache: "no-store",
      headers: { "Accept": "application/json" }
    });

    if (!response.ok) throw new Error(`Clock server returned HTTP ${response.status}`);

    const data = await response.json();
    const perfRecv = performance.now();
    const clientRecvUs = Date.now() * 1000;
    const rttUs = Math.max(0, Math.round((perfRecv - perfSend) * 1000));

    let serverEpochUs = readEpochUs(data);
    // Approximate the server timestamp at the midpoint of the request.
    let correctedServerUs = serverEpochUs + rttUs / 2;
    let driftUs = correctedServerUs - clientRecvUs;

    if (typeof data.server_recv_us === "number" && Number.isFinite(data.server_recv_us)) {
      driftUs = data.server_recv_us + rttUs / 2 - clientRecvUs;
    } else if (typeof data.server_recv_ms === "number" && Number.isFinite(data.server_recv_ms)) {
      driftUs = data.server_recv_ms * 1000 + rttUs / 2 - clientRecvUs;
    }

    currentRTTUs = rttUs;
    currentDriftUs = Math.round(driftUs);

    rttDisplay.textContent = `RTT: ${(currentRTTUs / 1000).toFixed(3)} ms`;
    driftDisplay.textContent =
      `Drift: ${currentDriftUs >= 0 ? "+" : ""}${(currentDriftUs / 1000).toFixed(3)} ms`;

    anchorServerTimeUs = correctedServerUs;
    anchorPerfTime = perfRecv;

    if (bc) {
      bc.postMessage({
        type: "offset_share",
        anchorServerTimeUs,
        anchorPerfTime
      });
    }
  } catch (error) {
    console.error("Time sync failed:", error);
  } finally {
    syncInProgress = false;
  }
}

if (bc) {
  bc.addEventListener("message", event => {
    const data = event.data;
    if (
      data?.type === "offset_share" &&
      typeof data.anchorServerTimeUs === "number" &&
      typeof data.anchorPerfTime === "number"
    ) {
      anchorServerTimeUs = data.anchorServerTimeUs;
      anchorPerfTime = data.anchorPerfTime;
    } else if (
      data?.type === "offset_share" &&
      typeof data.anchorServerTime === "number" &&
      typeof data.anchorPerfTime === "number"
    ) {
      anchorServerTimeUs = data.anchorServerTime * 1000;
      anchorPerfTime = data.anchorPerfTime;
    }
  });
}

async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
  } catch {}
}

function toggleMenu(event) {
  if (event) event.preventDefault();
  document.getElementById("tzMenu").classList.toggle("open");
}
tzToggleLink.addEventListener("click", toggleMenu);

const timezoneLocations = {
  "-12": "Baker Island", "-11": "American Samoa", "-10": "Hawaii", "-9": "Alaska",
  "-8": "Los Angeles", "-7": "Denver", "-6": "Chicago", "-5": "New York",
  "-4": "Santiago", "-3": "Buenos Aires", "-2": "South Georgia", "-1": "Azores",
  "0": "London", "1": "Berlin", "2": "Cairo", "3": "Moscow", "4": "Dubai",
  "5": "Karachi", "6": "Dhaka", "7": "Bangkok", "8": "Singapore", "9": "Tokyo",
  "10": "Sydney", "11": "Noumea", "12": "Auckland", "13": "Samoa", "14": "Kiritimati"
};
const allTimezones = [];
for (let offset = -12; offset <= 14; offset++) {
  const sign = offset >= 0 ? "+" : "-";
  const value = Math.abs(offset);
  const name = `Etc/GMT${offset >= 0 ? "-" : "+"}${value}`;
  const location = timezoneLocations[String(offset)] || "Unknown";
  allTimezones.push({ name, offset, display: `GMT${sign}${value} / ${location}` });
}

const tzList = document.getElementById("tzList");
const tzSearch = document.getElementById("tzSearch");

function renderTzList(filter = "") {
  tzList.replaceChildren();
  const fragment = document.createDocumentFragment();
  allTimezones
    .filter(timezone => timezone.display.toLowerCase().includes(filter.toLowerCase()))
    .forEach(timezone => {
      const option = document.createElement("div");
      option.className = "tz-option";
      option.textContent = timezone.display;
      option.addEventListener("click", () => {
        selectedTz = timezone.name;
        document.getElementById("tzDisplay").textContent = timezone.display;
        toggleMenu();
      });
      fragment.appendChild(option);
    });
  tzList.appendChild(fragment);
}

tzSearch.addEventListener("input", event => renderTzList(event.target.value));
renderTzList();

const displayFormatter = () => new Intl.DateTimeFormat("en-US", {
  timeZone: selectedTz,
  year: "numeric", month: "2-digit", day: "2-digit",
  hour: "2-digit", minute: "2-digit", second: "2-digit",
  hour12: !use24Hour
});

const analogFormatter = () => new Intl.DateTimeFormat("en-GB", {
  timeZone: selectedTz,
  hour: "2-digit", minute: "2-digit", second: "2-digit",
  hourCycle: "h23"
});

function clockLoop() {
  const nowPerf = performance.now();
  const elapsedUs = (nowPerf - anchorPerfTime) * 1000;
  const targetTimeUs = anchorServerTimeUs + elapsedUs;
  const targetTimeMs = targetTimeUs / 1000;
  const date = new Date(targetTimeMs);

  const parts = {};
  for (const part of displayFormatter().formatToParts(date)) parts[part.type] = part.value;

  const secondFractionUs = ((targetTimeUs % 1000000) + 1000000) % 1000000;
  const fractionalDigits = Math.floor(secondFractionUs).toString().padStart(6, "0");
  const suffix = parts.dayPeriod ? ` ${parts.dayPeriod}` : "";

  document.getElementById("dateRow").textContent = `${parts.year}-${parts.month}-${parts.day}`;
  document.getElementById("timeRow").innerHTML =
    `${parts.hour}:${parts.minute}:${parts.second}.<span>${fractionalDigits.slice(0, 3)}</span><span class="subnano">${fractionalDigits.slice(3)}</span>${suffix}`;

  const analogParts = {};
  for (const part of analogFormatter().formatToParts(date)) analogParts[part.type] = part.value;

  const hours = Number(analogParts.hour);
  const minutes = Number(analogParts.minute);
  const seconds = Number(analogParts.second);
  const fractionalSecond = secondFractionUs / 1000000;

  drawAnalog(hours, minutes, seconds, fractionalSecond);
  requestAnimationFrame(clockLoop);
}

function drawAnalog(hours, minutes, seconds, fractionalSecond) {
  ctx.clearRect(0, 0, 440, 440);
  ctx.save();
  ctx.translate(220, 220);
  const foreground = getComputedStyle(document.body).getPropertyValue("--text").trim();
  ctx.strokeStyle = foreground;

  for (let i = 0; i < 12; i++) {
    ctx.beginPath();
    ctx.moveTo(0, -190);
    ctx.lineTo(0, -210);
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.rotate(Math.PI / 6);
  }

  const exactSeconds = seconds + fractionalSecond;
  const exactMinutes = minutes + exactSeconds / 60;
  const exactHours = (hours % 12) + exactMinutes / 60;

  const drawHand = (angle, length, width, color) => {
    ctx.save();
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, 10);
    ctx.lineTo(0, -length);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.stroke();
    ctx.restore();
  };

  drawHand(exactHours * Math.PI / 6, 120, 10, foreground);
  drawHand(exactMinutes * Math.PI / 30, 170, 6, foreground);
  drawHand(exactSeconds * Math.PI / 30, 190, 3, "#E74C3C");
  ctx.restore();
}

const themeToggle = document.getElementById("themeToggle");
const savedTheme = localStorage.getItem("theme");
if (savedTheme === "dark") document.body.classList.add("dark");
themeToggle.textContent = document.body.classList.contains("dark") ? "☀" : "☾";

themeToggle.onclick = () => {
  document.body.classList.toggle("dark");
  const dark = document.body.classList.contains("dark");
  themeToggle.textContent = dark ? "☀" : "☾";
  localStorage.setItem("theme", dark ? "dark" : "light");
};

const formatToggle = document.getElementById("formatToggle");
formatToggle.textContent = use24Hour ? "12H" : "24H";
formatToggle.onclick = () => {
  use24Hour = !use24Hour;
  formatToggle.textContent = use24Hour ? "12H" : "24H";
  localStorage.setItem("timeFormat", use24Hour ? "24" : "12");
};

syncTime();
setInterval(syncTime, 30000);
requestWakeLock();
requestAnimationFrame(clockLoop);
</script>
</body>
</html>
